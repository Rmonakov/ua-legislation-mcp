name: release
# Запускається, коли на GitHub публікують реліз (Releases → Draft a new release → тег vX.Y.Z → Publish).
# Збирає розширення .mcpb і архів навички та додає їх до цього релізу.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версія з package.json збігається з тегом; manifest.json оновлюється з неї
        run: node scripts/sync-version.mjs --expect "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci --omit=dev
      - run: npx -y @anthropic-ai/mcpb pack . "dist/ua-legislation-mcp-${GITHUB_REF_NAME#v}.mcpb"
      - name: Пакет навички для Claude (тека навички — верхній рівень архіву)
        run: cd skills && zip -r ../dist/npa-ofitsiini-dzherela.zip npa-ofitsiini-dzherela
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.mcpb
            dist/*.zip
          generate_release_notes: true
